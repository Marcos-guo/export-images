name: Export Images

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Find and pull images
        run: |
          mkdir -p images
          
          # 测试 robusta-runner 的候选名
          RUNNER=""
          for img in \
            "robusta/robusta-runner:latest" \
            "robusta-dev/robusta-runner:latest" \
            "ghcr.io/robusta-dev/robusta-runner:latest" \
            "robustadev/robusta-runner:latest"
          do
            echo "=== Trying: $img ==="
            if docker pull "$img"; then
              echo "SUCCESS: $img"
              RUNNER="$img"
              break
            fi
          done
          
          # 测试 holmes 的候选名
          HOLMES=""
          for img in \
            "robusta/holmes:latest" \
            "robusta-dev/holmes:latest" \
            "ghcr.io/robusta-dev/holmes:latest" \
            "robustadev/holmes:latest"
          do
            echo "=== Trying: $img ==="
            if docker pull "$img"; then
              echo "SUCCESS: $img"
              HOLMES="$img"
              break
            fi
          done
          
          # 保存找到的名字
          echo "RUNNER=$RUNNER" > images/result.txt
          echo "HOLMES=$HOLMES" >> images/result.txt
          cat images/result.txt
          
          # 导出 tar
          if [ -n "$RUNNER" ]; then
            docker save "$RUNNER" -o images/robusta-runner.tar
          fi
          if [ -n "$HOLMES" ]; then
            docker save "$HOLMES" -o images/holmes.tar
          fi
          
          ls -lh images/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robusta-images
          path: images/
          retention-days: 7
