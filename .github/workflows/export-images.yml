name: Export Runner

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Find robusta-runner
        run: |
          mkdir -p images
          
          for img in \
            "robustadev/robusta-runner:v0.44.0" \
            "robustadev/robusta-runner:0.44.0" \
            "robusta/robusta-runner:latest" \
            "ghcr.io/robusta-dev/robusta-runner:latest" \
            "ghcr.io/robusta-dev/robusta:latest" \
            "robusta/robusta:latest"
          do
            echo "=== Trying: $img ==="
            if docker pull "$img"; then
              echo "SUCCESS: $img"
              echo "$img" > images/runner-name.txt
              docker save "$img" -o images/robusta-runner.tar
              break
            fi
          done
          
          cat images/runner-name.txt 2>/dev/null || echo "ALL FAILED"
          ls -lh images/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: runner-image
          path: images/
          retention-days: 7
